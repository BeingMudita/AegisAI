# ===========================================================================
# AegisAI — Global Policy Set
# ---------------------------------------------------------------------------
# System-wide rules that apply to every agent, loaded by
# app/policies/config.py. Per-agent allow/block lists live in
# app/policies/examples/*.json; a tool must pass BOTH layers.
#
# Numeric thresholds (TRUST_THRESHOLD, FIREWALL_BLOCK_THRESHOLD,
# FIREWALL_FLAG_THRESHOLD) are set in the environment — see .env.example.
# ===========================================================================

version: 1

defaults:
  default_action: deny           # tools not listed below are refused

# Tool registry. `allowed: false` is a global kill switch that overrides any
# agent policy. `min_trust` is the agent trust score needed to call the tool.
# `requires_approval: true` holds the call for a human decision after every
# automatic check has passed (re-checked again at approval time).
#
# Execution is sandboxed (simulated) unless TOOL_EXECUTION_MODE=live. In live
# mode the real adapters (app/tools/adapters.py) run, but a side-effecting one
# (send_email, external_upload, shell) runs only after approval — so to use a
# real egress tool, set it `allowed: true` AND `requires_approval: true`.
tools:
  - name: search_documents
    description: Semantic search over the company knowledge base.
    risk_level: LOW
    allowed: true
    min_trust: 0.4
    rate_limit_per_min: 60

  - name: read_database
    description: Read-only lookup in the finance database (customers, invoices).
    risk_level: MEDIUM
    allowed: true
    min_trust: 0.6
    rate_limit_per_min: 30
    data_category: customer_records

  - name: generate_report
    description: Format findings into a markdown report.
    risk_level: LOW
    allowed: true
    min_trust: 0.5
    rate_limit_per_min: 20

  - name: web_fetch
    description: Fetch a web page from an allow-listed domain.
    risk_level: MEDIUM
    allowed: true
    min_trust: 0.6
    rate_limit_per_min: 20

  - name: send_email
    description: Send an email to an address on an allow-listed domain.
    risk_level: HIGH
    allowed: true
    min_trust: 0.7
    rate_limit_per_min: 5
    requires_approval: true      # passes every check, then waits for an administrator

  - name: external_upload
    description: Upload a file to an external service.
    risk_level: CRITICAL
    allowed: false

  - name: shell
    description: Execute a shell command.
    risk_level: CRITICAL
    allowed: false

rag:
  allow_untrusted_sources: false # drop chunks from UNTRUSTED sources at retrieval
  min_source_trust: 0.3          # drop chunks whose source trust fell below this
  min_similarity: 0.15           # ignore weak matches
  max_context_chunks: 5

audit:
  log_all_decisions: true
  log_blocked_only: false

# Per-principal consumption budgets (OWASP LLM10 — unbounded consumption).
# Counted per user or API caller and reset at 00:00 UTC; 0 = unlimited. A turn
# is refused (HTTP 429) once any limit is used up. Tokens are what the LLM
# reports; with the rule-based planner they are estimated from the text.
budgets:
  daily_turns: 500
  daily_tokens: 200000
  daily_cost_usd: 0              # no cost cap while pricing is zero (local Ollama)
  max_output_tokens: 1024        # cap on what one LLM call may generate
  pricing:                       # USD per 1,000 tokens, for hosted models
    prompt_per_1k: 0.0
    completion_per_1k: 0.0
  roles:                         # overrides by role
    ADMIN:
      daily_turns: 2000
      daily_tokens: 1000000
  principals: {}                 # overrides by principal, e.g.  api-key: {daily_tokens: 50000}

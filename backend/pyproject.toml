[project]
name = "aegisai-backend"
version = "0.1.0"
description = "A zero-trust security layer for autonomous AI agents."
requires-python = ">=3.11"

[tool.ruff]
extend-exclude = ["migrations/versions"]  # autogenerated by Alembic
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "B008",   # FastAPI's Depends()/Query() in defaults is the framework idiom
  "UP017",  # timezone.utc is used consistently across the codebase
  "UP037",  # quoted forward refs in SQLAlchemy Mapped[] annotations
  "UP042",  # (str, Enum) kept for pydantic/SQLAlchemy enum compatibility
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true

# Pinned model artifacts — model provenance (Phase 13, OWASP LLM03).
#
# With MODEL_PROVENANCE=enforce (the default) AegisAI uses a model only if it
# matches an entry here:
#
#  * Hugging Face models are downloaded at an exact commit, and every file the
#    loader reads is checked against its SHA-256 *before* the model is loaded.
#    Only the listed files are fetched (no ONNX/TF/OpenVINO copies).
#  * Ollama models are identified by their manifest digest — the ID that
#    `ollama list` prints. The manifest names every layer (weights, template,
#    parameters, license) by its SHA-256 and Ollama verifies each layer when it
#    pulls, so this one digest pins the whole model.
#
# Changing a pin is a reviewed change; see docs/supply-chain.md for how the
# values were obtained and how to update them.


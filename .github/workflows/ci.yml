name: CI

# Every action is pinned to a full commit SHA (tags can be moved); Dependabot
# proposes updates. The version comment after each SHA is for humans.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LLM_BACKEND: rule_based
      EMBEDDING_BACKEND: hashing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt
      # The lockfile pins (and hashes) every runtime package — the same set the image installs.
      - run: pip install -r requirements.lock
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests ../evaluation
      - name: Type-check
        run: mypy app
      - name: Known vulnerabilities in runtime dependencies
        run: pip-audit -r requirements.lock --disable-pip --progress-spinner off
      - name: Tests (includes the red-team security gate)
        run: pytest -q
      - name: Evaluation report
        working-directory: .
        run: python evaluation/run_eval.py --out evaluation/results
      - name: Phase 11 four-configuration experiment
        working-directory: .
        run: python evaluation/run_experiments.py --out evaluation/results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: evaluation-report
          path: evaluation/results/

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      LLM_BACKEND: rule_based
      EMBEDDING_BACKEND: hashing
      TEST_DATABASE_URL: postgresql://aegis:aegis@localhost:5432/aegis_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt
      - run: pip install -r requirements.lock
      - run: pip install pytest pytest-asyncio httpx
      - name: Tests on PostgreSQL (incl. cross-worker guarantees)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Known vulnerabilities in shipped dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check and build
        run: npm run build
      - name: Unit tests (Vitest)
        run: npm run test

  # Phase 13 — supply chain: SBOMs for the code, an AI-BOM for the models, and
  # vulnerability / misconfiguration scans of the images that ship.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the backend and the SBOM generator
        working-directory: backend
        run: |
          pip install -r requirements.lock
          pip install cyclonedx-bom==7.5.0
      - name: SBOM — Python runtime dependencies (from the hashed lockfile)
        working-directory: backend
        run: >-
          cyclonedx-py requirements requirements.lock --pyproject pyproject.toml
          --sv 1.6 --of JSON --output-reproducible -o ../sbom/backend.cdx.json
      - name: SBOM — npm dependencies shipped in the dashboard
        working-directory: frontend
        run: |
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --spec-version 1.6 \
            --output-reproducible --output-file ../sbom/frontend.cdx.json
      - name: AI-BOM — pinned models (CycloneDX machine-learning-model)
        working-directory: backend
        run: python -m app.platform.cli aibom -o ../sbom/models.cdx.json
      - name: Dockerfile misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: docker
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: v0.75.0
      - name: Build the images
        run: |
          docker build -f docker/Dockerfile.backend -t aegisai-backend:ci .
          docker build -f docker/Dockerfile.frontend -t aegisai-frontend:ci .
      - name: Scan the backend image (fixable HIGH/CRITICAL fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: aegisai-backend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          version: v0.75.0
      - name: Scan the frontend image (fixable HIGH/CRITICAL fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: aegisai-frontend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          version: v0.75.0
      - name: SBOM — backend image (OS packages + Python)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: aegisai-backend:ci
          format: cyclonedx
          output: sbom/backend-image.cdx.json
          version: v0.75.0
      - name: SBOM — frontend image
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: aegisai-frontend:ci
          format: cyclonedx
          output: sbom/frontend-image.cdx.json
          version: v0.75.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: sbom
          path: sbom/

  e2e:
    runs-on: ubuntu-latest
    env:
      LLM_BACKEND: rule_based
      EMBEDDING_BACKEND: hashing
      RAG_PERSIST: "false"
      AEGIS_PY: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright starts the full stack)
        working-directory: frontend
        run: npm run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/

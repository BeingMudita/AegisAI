name: AegisAI Security

# DevSecOps for agentic AI: every change to the agent or its policy is audited
# and red-teamed again, and a weakening change blocks the pull request.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # so the action can post the security report as a comment

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AegisAI security gate
        uses: ./.github/actions/aegis-security
        with:
          target: aegis.yaml # the agent's policy file in the repo (defines FinanceAgent).
          # NB: a bare agent name only resolves against a running, seeded system;
          # in CI (in-memory, no seed) point the gate at the policy file instead.
          threshold: "90"
          redteam: "true"
          aegis-path: backend

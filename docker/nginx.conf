# Serves the dashboard and proxies the API so the browser sees one origin.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # nginx is the edge here: replace (don't append to) any client-supplied header,
        # so the backend's login throttle sees the real address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Agent turns are capped by AGENT_TURN_TIMEOUT (150 s by default); keep this above it.
        proxy_read_timeout 200s;
        # Uploads: match MAX_UPLOAD_MB (1024) and stream them through instead of
        # buffering whole files on the proxy's disk first.
        client_max_body_size 1024m;
        proxy_request_buffering off;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}

# ===========================================================================
# AegisAI — local stack
# Run from repo root:  docker compose -f docker/docker-compose.yml up --build
#   dashboard → http://localhost:8080      API → http://localhost:8000/docs
#   State (events, trust, sessions, knowledge base…) lives in the db volume.
# Add a local LLM:     docker compose -f docker/docker-compose.yml --profile llm up --build
#   then pull a model once: docker compose -f docker/docker-compose.yml exec ollama ollama pull llama3.1:8b
# ===========================================================================
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aegisai}
    ports:
      - "127.0.0.1:5432:5432"   # local tools only; the backend uses the compose network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: db
      DATABASE_URL: postgresql://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD:-aegis_dev_password}@db:5432/${POSTGRES_DB:-aegisai}
      STORAGE_BACKEND: postgres   # durable state; workers share it
      WEB_CONCURRENCY: "2"
      OLLAMA_BASE_URL: http://ollama:11434
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ports:
      - "127.0.0.1:8000:8000"   # API docs for local use; browsers go through the frontend
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:0.35.1   # pinned; bump deliberately
    profiles: ["llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
